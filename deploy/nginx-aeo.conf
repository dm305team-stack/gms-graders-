# AEO Visibility Auditor — nginx reverse proxy.
#
# The public landing and the lead funnel API are open. The operator console
# (/console.html) and the two endpoints that feed it (the audit list and the
# per-audit data blob) are gated behind HTTP basic auth.
#
# Install:
#   sudo htpasswd -c /etc/nginx/.htpasswd operador
#   sudo cp deploy/nginx-aeo.conf /etc/nginx/sites-available/aeo
#   # edit server_name below to your domain
#   sudo ln -s /etc/nginx/sites-available/aeo /etc/nginx/sites-enabled/aeo
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run `sudo certbot --nginx -d scanaeo.com -d www.scanaeo.com`; certbot
# rewrites this block to add the TLS (443) server and the 80->443 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name scanaeo.com www.scanaeo.com;   # <-- replace with your domain

    client_max_body_size 2m;

    # Proxy headers set at server scope are inherited by every location that
    # does not declare its own proxy_set_header.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Operator console UI: gated ---
    location = /console.html {
        auth_basic "AEO Console";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:3334;
    }

    # --- Console data endpoints: gated ---
    # Audit list (the console's index).
    location = /api/analyses {
        auth_basic "AEO Console";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:3334;
    }
    # Per-audit detail blob: /api/analyses/<id>/data
    location ~ ^/api/analyses/[^/]+/data$ {
        auth_basic "AEO Console";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:3334;
    }

    # --- Everything else: open ---
    # Public landing, static assets, and the funnel API (run-analysis, status,
    # report, report.pdf, unlock). The audit-status endpoint
    # /api/analyses/<id> stays open here because the public funnel polls it.
    location / {
        proxy_pass http://127.0.0.1:3334;
    }
}
